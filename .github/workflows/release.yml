name: Build & Release v2.2.1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode Keystore from Secrets
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/otso-release.jks

      - name: Build Release APK
        env:
          KEYSTORE_PATH: otso-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -XX:+UseParallelGC' > gradle.properties
          echo 'org.gradle.parallel=true' >> gradle.properties
          echo 'org.gradle.caching=true' >> gradle.properties
          echo 'org.gradle.workers.max=2' >> gradle.properties
          echo 'android.suppressUnsupportedCompileSdk=35' >> gradle.properties
          echo 'android.useAndroidX=true' >> gradle.properties
          echo 'android.enableJetifier=true' >> gradle.properties
          rm -f ~/.gradle/gradle.properties
          echo "=== gradle.properties ==="
          cat gradle.properties
          echo "========================="
          chmod +x gradlew
          ./gradlew :app:assembleRelease

      - name: List APK outputs
        run: find app/build/outputs/apk -name "*.apk" 2>/dev/null || echo "No APKs found in output directory"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: OtsoNote-v2.2.1-Release
          path: app/build/outputs/apk/release/**/*.apk
          if-no-files-found: error
